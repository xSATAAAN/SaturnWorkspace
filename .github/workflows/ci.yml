name: Web CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-required:
    name: web-required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    services:
      otp-postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: otp_qa_admin
          POSTGRES_PASSWORD: synthetic-otp-ci-password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U otp_qa_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out the candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            workers/admin/package-lock.json
            workers/auth/package-lock.json
            workers/policy/package-lock.json
            workers/route-check/package-lock.json

      - name: Verify the production promotion boundary
        run: |
          node --test tools/authority-surface.test.mjs
          node tools/check-authority-surface.mjs
          node --test tools/deployment-boundary.test.mjs
          node tools/check-deployment-boundary.mjs
          node --test tools/runtime-contract.test.mjs

      - name: Install locked site dependencies
        working-directory: site
        run: npm ci

      - name: Verify the site
        working-directory: site
        run: |
          npm run lint
          npm run build
          npm run test:production-integration
          npm run test:production-rollout
          npm run test:content
          npm run test:account-linking
          npm run test:admin-surface

      - name: Install locked admin Worker dependencies
        working-directory: workers/admin
        run: npm ci

      - name: Verify the admin Worker
        working-directory: workers/admin
        run: |
          npm run check:syntax
          npm run test:required

      - name: Install locked auth Worker dependencies
        working-directory: workers/auth
        run: npm ci

      - name: Verify the auth Worker
        working-directory: workers/auth
        run: |
          npm run check
          npm run test:device-linking

      - name: Verify atomic email OTP admission in PostgreSQL
        working-directory: workers/auth
        env:
          SATURN_OTP_TEST_PSQL: psql
          SATURN_OTP_TEST_CONTAINER: ${{ job.services.otp-postgres.id }}
          SATURN_OTP_TEST_PORT: "5432"
          PGPASSWORD: synthetic-otp-ci-password
        run: npm run test:email-otp-postgres

      - name: Install locked policy Worker dependencies
        working-directory: workers/policy
        run: npm ci

      - name: Verify the policy Worker
        working-directory: workers/policy
        run: npm run test:required

      - name: Install locked route-check Worker dependencies
        working-directory: workers/route-check
        run: npm ci

      - name: Verify the route-check Worker
        working-directory: workers/route-check
        run: npm run test:required
