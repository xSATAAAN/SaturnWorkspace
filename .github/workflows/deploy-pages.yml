name: Deploy reviewed site candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to promote after its protected CI check succeeds
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    env:
      CI: "true"
      SATURNWS_SOURCE_SHA: ${{ inputs.source_sha }}
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}

    steps:
      - name: Check out the promotion authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Verify the protected source candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SATURNWS_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          test "$SATURNWS_SOURCE_SHA" = "$(git rev-parse origin/main)"
          git cat-file -e "${SATURNWS_SOURCE_SHA}^{commit}"
          node tools/verify-protected-source.mjs
          git checkout --detach "$SATURNWS_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SATURNWS_SOURCE_SHA"

      - name: Install locked site dependencies
        working-directory: site
        run: npm ci

      - name: Verify the site candidate
        working-directory: site
        run: |
          npm run lint
          node scripts/check-production-env.mjs
          npm run build
          npm run test:new-ui:round3b
          npm run test:phase-b
          npm run test:phase-b1
          npm run test:phase-f

      - name: Publish static pages and SPA path fallbacks
        run: node tools/publish-static-pages.mjs

      - name: Verify frontend cutover output
        working-directory: site
        run: node scripts/check-frontend-cutover.mjs

      - name: Write source provenance
        env:
          SATURNWS_REPOSITORY: ${{ github.repository }}
          SATURNWS_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SATURNWS_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tools/write-pages-provenance.mjs

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload reviewed Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy reviewed artifact to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
